server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # Интерфейс — одностраничное приложение: адреса вроде /onboarding/<токен>
    # существуют только в браузере, на диске такого файла нет. Без подмены на
    # index.html переход по ссылке из письма давал бы 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Без явного правила проверка живости уходила бы в SPA-фолбэк и всегда
    # отвечала бы страницей интерфейса — то есть «здоров» даже при мёртвом API.
    location = /health {
        proxy_pass http://api:3000/health;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Этапы конвейера идут минутами: ответ модели приходит одним запросом,
        # и обычные 60 секунд обрывают его на середине.
        proxy_read_timeout 600s;
    }

    # Сгенерированное медиа и загруженные референсы раздаёт приложение: файлы
    # лежат в его томах, а не в образе с интерфейсом.
    location /media/ {
        proxy_pass http://api:3000;
    }

    location /uploads/ {
        proxy_pass http://api:3000;
    }
}
