<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Своими словами — текст, в котором слышно именно вас</title>
    <meta
      name="description"
      content="Сервис разбирает вашу аудиторию и экспертность, а потом пишет контент вашим голосом: посты, картинки и сценарий рилса — без общих фраз, которые может написать кто угодно."

    <!-- Ссылку на готовые результаты клиенты пересылают знакомым, и в
         мессенджерах она разворачивается в карточку — без этих тегов там был бы
         голый адрес. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Своими словами" />
    <meta property="og:title" content="Своими словами — текст, в котором слышно именно вас" />

      property="og:description"
      content="Разбор аудитории и экспертности, а затем контент вашим голосом: посты, картинки и сценарий рилса."
    />
    <meta name="theme-color" content="#4a2545" />
    <!-- Иконка вшита в разметку, а не лежит файлом: один сливовый знак цитаты —
         тот же мотив, что и на экранах, и лишний запрос не нужен. -->

      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234a2545'/%3E%3Ctext x='16' y='25' font-family='Georgia,serif' font-size='26' font-weight='700' text-anchor='middle' fill='%23fafaf6'%3E%E2%80%9E%3C/text%3E%3C/svg%3E"
